spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillshub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
dataops.backup-directory=${DATAOPS_BACKUP_DIRECTORY:./backups}
dataops.postgres.pg-dump=${PG_DUMP_EXECUTABLE:pg_dump}
dataops.postgres.pg-restore=${PG_RESTORE_EXECUTABLE:pg_restore}
spring.servlet.multipart.max-file-size=${DATAOPS_MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${DATAOPS_MAX_REQUEST_SIZE:5MB}
auth.demo-password=${AUTH_DEMO_PASSWORD:demo123}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}